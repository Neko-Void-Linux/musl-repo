name: MUSL Repo Updater/BUILD

on:
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Solo sincronizar y firmar (Saltar compilación)'
        required: true
        type: boolean
        default: false
      packages:
        description: 'Paquetes a compilar (separados por comas: pkg1, pkg2)'
        required: false
        type: string
        default: ''
      migrate_sf:
        description: 'Descargar estado base desde SourceForge (si es false, usa GitHub Releases)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl jq rsync sshpass bubblewrap xz-utils git nodejs tar

      - name: Setup Void musl chroot
        run: |
          sudo mkdir -p /tmp/void-musl-chroot
          sudo wget -qO- https://repo-default.voidlinux.org/live/current/void-x86_64-musl-ROOTFS-20250202.tar.xz | sudo tar -xJp -C /tmp/void-musl-chroot
          sudo chroot /tmp/void-musl-chroot xbps-install -S --repository=https://repo-de.voidlinux.org/current/musl
          sudo chroot /tmp/void-musl-chroot xbps-install -yu --repository=https://repo-de.voidlinux.org/current/musl xbps
          sudo chroot /tmp/void-musl-chroot xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/musl
          sudo chroot /tmp/void-musl-chroot xbps-install -Sy --repository=https://repo-de.voidlinux.org/current/musl base-devel git xtools sudo rsync openssh sshpass python3 python3-pip tar curl jq tar shadow

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare void-packages in chroot
        run: |
          sudo chroot /tmp/void-musl-chroot /bin/bash -c "
            git clone --depth 1 https://github.com/void-linux/void-packages.git /tmp/void-packages
            cd /tmp/void-packages
            git clone https://github.com/Neko-Void-Linux/musl-repo.git custompkgs
            cp -rf custompkgs/* srcpkgs/
            echo '#nnothing' >> common/build-style/none.sh
            echo 'libscenefx-0.5.so scenefx-latest-0.5_1' >> common/shlibs
            echo 'libQt6Pas.so.6 libqt6pas-bin-6.2.10_1' >> common/shlibs
            groupadd -f xbuilder
            useradd -m -s /bin/bash -G xbuilder builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
            chown -R builder:builder /tmp/void-packages
          "

      - name: Download existing repo state
        env:
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo chroot /tmp/void-musl-chroot /bin/bash -c "
            mkdir -p /tmp/void-packages/hostdir/binpkgs
            cd /tmp/void-packages/hostdir/binpkgs
            if [ '${{ inputs.migrate_sf }}' = 'true' ]; then
              sshpass -e rsync -avz --delete -e 'ssh -o StrictHostKeyChecking=no' \${SFTP_USER}@frs.sourceforge.net:/home/frs/project/neko-void/repo/musl . || echo 'Advertencia: Fallo al descargar desde SF'
            else
              gh release download stable --dir . --pattern '*' || echo 'Advertencia: El release stable no existe o está vacío'
            fi
            chown -R builder:builder /tmp/void-packages
          "

      - name: Build package
        if: ${{ !inputs.sync_only && inputs.packages != '' }}
        run: |
          sudo chroot /tmp/void-musl-chroot /bin/bash -c "
            su - builder -c 'cd /tmp/void-packages && XBPS_ALLOW_RESTRICTED=yes ./xbps-src -N binary-bootstrap'
            IFS=',' read -ra PKGS <<< '${{ inputs.packages }}'
            for pkg in \"\${PKGS[@]}\"; do
              pkg=\$(echo \"\$pkg\" | xargs)
              if [ -n \"\$pkg\" ]; then
                echo \"Compilando paquete: \$pkg\"
                su - builder -c \"cd /tmp/void-packages && XBPS_ALLOW_RESTRICTED=yes ./xbps-src -N pkg \$pkg\"
              fi
            done
          "

      - name: Sign packages and index
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
        run: |
          echo "\$XBPS_PRIVATE_KEY" | sudo tee /tmp/void-musl-chroot/tmp/privkey.pem > /dev/null
          sudo chroot /tmp/void-musl-chroot /bin/bash -c "
            cd /tmp/void-packages/hostdir/binpkgs
            rm -f x86_64-repodata *.sig2 *.sig
            if ls *.xbps 1> /dev/null 2>&1; then
              xbps-rindex --sign-pkg --privkey /tmp/privkey.pem *.xbps
              xbps-rindex -a *.xbps
            fi
            xbps-rindex --sign --signedby 'javierc' --privkey /tmp/privkey.pem .
            rm /tmp/privkey.pem
          "

      - name: Deploy to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo chroot /tmp/void-musl-chroot /bin/bash -c "
            git config --global --add safe.directory '*'
            cd /tmp/void-packages/hostdir/binpkgs
            shopt -s nullglob
            ARCHIVOS=()
            for f in *.xbps *.sig *.sig2 *-repodata*; do
              if [ -f \"\$f\" ]; then
                ARCHIVOS+=(\"\$f\")
              fi
            done
            if [ \${#ARCHIVOS[@]} -eq 0 ]; then
              echo 'No hay archivos para subir al release.'
            else
              REPO='${{ github.repository }}'
              if gh release view packages --repo \"\$REPO\" >/dev/null 2>&1; then
                gh release upload packages \"\${ARCHIVOS[@]}\" --clobber --repo \"\$REPO\"
              else
                gh release create packages \"\${ARCHIVOS[@]}\" --title 'Stable Release' --notes 'Repositorio oficial de paquetes musl para Neko Void' --repo \"\$REPO\"
              fi
            fi
          "

      - name: Deploy to SourceForge
        env:
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo chroot /tmp/void-musl-chroot /bin/bash -c "
            cd /tmp/void-packages/hostdir/binpkgs
            sshpass -e rsync -avz --delete -e 'ssh -o StrictHostKeyChecking=no' . \${SFTP_USER}@frs.sourceforge.net:/home/frs/project/neko-void/repo/musl/
          "
